<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GolpeRadar - Threat Scanner</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: 'Orbitron', monospace; 
            background: #0a0a0a; 
            color: #00ff41;
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 20% 50%, #001a00 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, #1a0000 0%, transparent 50%);
            overflow-x: hidden;
        }
        
        .scan-line {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: #00ff41;
            box-shadow: 0 0 10px #00ff41;
            animation: scan 3s linear infinite;
            z-index: 1000;
        }
        
        @keyframes scan {
            0% { top: 0%; opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }
        
        .container { 
            max-width: 700px; 
            margin: 0 auto; 
            padding: 40px 20px;
            position: relative;
            z-index: 1;
        }
        
        h1 { 
            font-size: 3rem;
            font-weight: 900;
            text-align: center;
            margin-bottom: 10px;
            text-shadow: 0 0 20px #00ff41;
            animation: flicker 2s infinite alternate;
        }
        
        @keyframes flicker {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.8; }
        }
        
        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 40px;
            font-size: 0.9rem;
            letter-spacing: 2px;
        }
        
        .input-box {
            background: rgba(0, 255, 65, 0.05);
            border: 1px solid #00ff41;
            border-radius: 0;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 0 30px rgba(0, 255, 65, 0.2);
        }
        
        input { 
            width: 100%; 
            padding: 15px; 
            background: #000;
            border: 1px solid #00ff41;
            color: #00ff41;
            font-family: 'Orbitron', monospace;
            font-size: 14px;
            margin-bottom: 15px;
        }
        
        input:focus {
            outline: none;
            box-shadow: 0 0 15px #00ff41;
        }
        
        button { 
            width: 100%;
            padding: 15px; 
            background: #00ff41;
            color: #000;
            border: none;
            font-family: 'Orbitron', monospace;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
        }
        
        button:hover {
            background: #000;
            color: #00ff41;
            box-shadow: 0 0 20px #00ff41;
        }
        
        .resultado {
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid #333;
            padding: 30px;
            margin-top: 20px;
            display: none;
        }
        
        .resultado.perigoso {
            border-color: #ff0000;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.5);
            animation: alert 0.5s infinite;
        }
        
        .resultado.seguro {
            border-color: #00ff41;
            box-shadow: 0 0 30px rgba(0, 255, 65, 0.5);
        }
        
        .resultado.atencao {
            border-color: #ffaa00;
            box-shadow: 0 0 30px rgba(255, 170, 0, 0.5);
        }
        
        @keyframes alert {
            0%, 100% { border-color: #ff0000; }
            50% { border-color: #800000; }
        }
        
        .status {
            font-size: 2rem;
            font-weight: 900;
            text-align: center;
            margin-bottom: 20px;
        }
        
        .status.perigoso { color: #ff0000; text-shadow: 0 0 20px #ff0000; }
        .status.seguro { color: #00ff41; text-shadow: 0 0 20px #00ff41; }
        .status.atencao { color: #ffaa00; text-shadow: 0 0 20px #ffaa00; }
        
        .score-bar {
            width: 100%;
            height: 30px;
            background: #111;
            border: 1px solid #333;
            margin: 20px 0;
            position: relative;
            overflow: hidden;
        }
        
        .score-fill {
            height: 100%;
            transition: width 1s ease-out;
            position: relative;
        }
        
        .score-fill.perigoso { background: #ff0000; box-shadow: 0 0 20px #ff0000; }
        .score-fill.seguro { background: #00ff41; box-shadow: 0 0 20px #00ff41; }
        .score-fill.atencao { background: #ffaa00; box-shadow: 0 0 20px #ffaa00; }
        
        .score-text {
            position: absolute;
            width: 100%;
            text-align: center;
            line-height: 30px;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 0 5px #000;
        }
        
        .avisos {
            margin-top: 20px;
        }
        
        .avisos li {
            list-style: none;
            padding: 10px;
            margin: 5px 0;
            background: rgba(255, 0, 0, 0.1);
            border-left: 3px solid #ff0000;
        }
    </style>
</head>
<body>
    <div class="scan-line"></div>
    <div class="container">
        <h1>☠️ GOLPERADAR ☠️</h1>
        <p class="subtitle">[ THREAT DETECTION SYSTEM v1.0 ]</p>
        
        <div class="input-box">
            <input type="text" id="url" placeholder="COLE A URL ALVO AQUI...">
            <button onclick="analisar()">[ INICIAR SCAN ]</button>
        </div>
        
        <div id="resultado" class="resultado">
            <div id="status" class="status"></div>
            <div class="score-bar">
                <div id="score-fill" class="score-fill">
                    <div id="score-text" class="score-text"></div>
                </div>
            </div>
            <div class="avisos">
                <ul id="avisos-list"></ul>
            </div>
        </div>
    </div>

    <script>
        async function analisar() {
            const url = document.getElementById('url').value;
            const btn = document.querySelector('button');
            btn.textContent = '[ ESCANEANDO... ]';
            btn.disabled = true;
            
            try {
                const response = await fetch('/analisar', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({url: url})
                });
                
                const data = await response.json();
                const resultado = document.getElementById('resultado');
                const status = document.getElementById('status');
                const scoreFill = document.getElementById('score-fill');
                const scoreText = document.getElementById('score-text');
                const avisosList = document.getElementById('avisos-list');
                
                // Define classe por status
                resultado.className = 'resultado';
                if (data.status === 'Perigoso') {
                    resultado.classList.add('perigoso');
                    status.className = 'status perigoso';
                    status.innerHTML = '☠️ AMEAÇA DETECTADA ☠️';
                    scoreFill.className = 'score-fill perigoso';
                } else if (data.status === 'Seguro') {
                    resultado.classList.add('seguro');
                    status.className = 'status seguro';
                    status.innerHTML = '🛡️ SISTEMA SEGURO 🛡️';
                    scoreFill.className = 'score-fill seguro';
                } else {
                    resultado.classList.add('atencao');
                    status.className = 'status atencao';
                    status.innerHTML = '⚠️ ALERTA DE RISCO ⚠️';
                    scoreFill.className = 'score-fill atencao';
                }
                
                // Anima barra
                setTimeout(() => {
                    scoreFill.style.width = data.score + '%';
                    scoreText.textContent = `THREAT LEVEL: ${data.score}/100`;
                }, 100);
                
                // Avisos
                avisosList.innerHTML = '';
                data.avisos.forEach(aviso => {
                    const li = document.createElement('li');
                    li.textContent = `> ${aviso}`;
                    avisosList.appendChild(li);
                });
                
                resultado.style.display = 'block';
                
            } catch (error) {
                alert('ERRO NO SCAN: ' + error);
            }
            
            btn.textContent = '[ INICIAR SCAN ]';
            btn.disabled = false;
        }
    </script>
</body>
</html>
